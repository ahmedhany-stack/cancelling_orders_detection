name: Automated Model Retraining Pipeline

on:
  # 1. إمكانية تشغيل الـ Pipeline يدوياً من GitHub Actions
  workflow_dispatch:
  
  # 2. تشغيل أوتوماتيك أسبوعياً (كل يوم أحد الساعة 12 منتصف الليل)
  schedule:
    - cron: '0 0 * * 0'

# إعطاء صلاحيات لكتابة التعليقات على الـ Commits والـ Pull Requests
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. إنشاء هياكل المجلدات المطلوبة لتجنب أخطاء المسارات
      - name: Create Artifacts Directory Structure
        run: |
          mkdir -p artifacts/features
          mkdir -p artifacts/models

      # 2. تثبيت DVC وسحب البيانات الكبيرة من DagsHub
      - name: Setup & Pull Data via DVC
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          pip install dvc dvc-http
          python -m dvc remote add origin https://dagshub.com/ahmedhany-stack/cancelling_orders_detection.dvc -f
          python -m dvc remote modify origin --local auth basic
          python -m dvc remote modify origin --local user ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          python -m dvc remote modify origin --local password ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          python -m dvc pull -r origin || true

      # 3. تنفيذ سكريبت إعادة التدريب والمقارنة (مع تشغيل سكريبت تجهيز البيانات أوتوماتيكياً لو الملف مش موجود)
      - name: Execute Model Retraining & Evaluation
        env:
          PYTHONPATH: .
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          DAGSHUB_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          if [ ! -f "artifacts/features/engineered_data.csv" ]; then
              echo "⚠️ Engineered data not found after DVC pull! Generating data pipeline..."
              python src/components/data_ingestion.py || true
              python src/components/data_transformation.py || true
          fi

          python src/components/model_trainer.py

      # 4. نشر تقرير التقييم والـ Metrics كـ Comment على الـ Commit
      - name: Post Evaluation Metrics as Commit Comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const metrics = fs.readFileSync('artifacts/models/metrics.json', 'utf8');
            const body = `## 🤖 Automated Model Retraining Results\n### Latest Evaluated Metrics\n\`\`\`json\n${metrics}\n\`\`\``;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });