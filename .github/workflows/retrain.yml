name: Automated Model Retraining Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Latest Data via DVC
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          dvc pull || echo "DVC pull skipped if no remote set"

      - name: Execute Model Retraining & Evaluation
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/ahmedhany-stack/cancelling_orders_detection.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python src/components/model_trainer.py

      # نشر تقرير النتائج كـ Commit Comment باستخدام GitHub Script المباشر
      - name: Post Evaluation Metrics as Commit Comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const metrics = fs.readFileSync('artifacts/models/metrics.json', 'utf8');
            const body = `## 🤖 Automated Model Retraining Results\n### Latest Evaluated Metrics\n\`\`\`json\n${metrics}\n\`\`\``;
            
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });